name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployment:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm and Node.js versions are read from `devEngines` in package.json.
      # Also runs `pnpm install --frozen-lockfile`.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Run tests
        run: pnpm test

      # VITE_* values come from repo Settings → Secrets and variables → Actions → Variables.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CREATO_API_URL: ${{ vars.VITE_CREATO_API_URL }}
          VITE_CREATO_WS_URL: ${{ vars.VITE_CREATO_WS_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
